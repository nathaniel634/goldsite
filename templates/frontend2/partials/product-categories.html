<!--==============================================
PRODUCT CATEGORIES
===============================================-->
{% load static %}
<section class="pmx-product-categories pmx-section">

    <div class="container">

        <div class="text-center mb-5">

            <span class="pmx-section-heading__subtitle">

                OUR CATEGORIES

            </span>

            <h2 class="pmx-section-heading__title">

                Explore Our Precious Metals

            </h2>

        </div>

        <div class="row g-4">

            <div class="col-lg-3 col-md-6">

                <div class="pmx-category-card">

                    <img src="{% static 'frontend2/images/golds/gold-piles.png' %}" alt="Gold">

                    <div class="pmx-category-card__body">

                        <h4>Gold</h4>

                        <p>Bars, coins and bullion.</p>

                    </div>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="pmx-category-card">

                    <img src="{% static 'frontend2/images/silver/silver-piles.png' %}" alt="Silver">

                    <div class="pmx-category-card__body">

                        <h4>Silver</h4>

                        <p>Investment-grade silver products.</p>

                    </div>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="pmx-category-card">

                    <img src="{% static 'frontend2/images/diamond/diamond-piles.png' %}" alt="Platinum">

                    <div class="pmx-category-card__body">

                        <h4>Diamond</h4>

                        <p>Premium Diamond Products.</p>

                    </div>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="pmx-category-card">

                    <img src="{% static 'frontend2/images/palladium/palladium-piles.png' %}" alt="Palladium">

                    <div class="pmx-category-card__body">

                        <h4>Palladium</h4>

                        <p>Industrial and investment solutions.</p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
