<!--==================================================
CONTACT FORM
===================================================-->

<section class="pmx-contact-form-section pmx-section pmx-bg-light">

    <div class="container">

        <div class="row g-5">

            <div class="col-lg-7">

                <div class="pmx-contact-form">

                    <span class="pmx-section-heading__subtitle">

                        SEND MESSAGE

                    </span>

                    <h2 class="pmx-section-heading__title">

                        Get In Touch

                    </h2>

                    <form>

                        <div class="row g-3">

                            <div class="col-md-6">

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Full Name">

                            </div>

                            <div class="col-md-6">

                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="Email Address">

                            </div>

                            <div class="col-md-6">

                                <input
                                    type="tel"
                                    class="form-control"
                                    placeholder="Phone Number">

                            </div>

                            <div class="col-md-6">

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Subject">

                            </div>

                            <div class="col-12">

                                <textarea
                                    rows="6"
                                    class="form-control"
                                    placeholder="Your Message"></textarea>

                            </div>

                            <div class="col-12">

                                <button class="pmx-btn pmx-btn--primary">

                                    Send Message

                                </button>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

            <div class="col-lg-5">

                <div class="pmx-contact-side">

                    <h3>

                        Why Contact PMX?

                    </h3>

                    <p>

                        Whether you're interested in purchasing precious metals,
                        requesting a quote, or learning more about our services,
                        our experienced team is here to assist you.

                    </p>

                    <ul class="pmx-contact-list">

                        <li>

                            <i class="bi bi-check-circle-fill"></i>

                            Fast Response

                        </li>

                        <li>

                            <i class="bi bi-check-circle-fill"></i>

                            Expert Consultation

                        </li>

                        <li>

                            <i class="bi bi-check-circle-fill"></i>

                            Transparent Pricing

                        </li>

                        <li>

                            <i class="bi bi-check-circle-fill"></i>

                            Secure Transactions

                        </li>

                    </ul>

                </div>

            </div>

        </div>

    </div>

</section>
