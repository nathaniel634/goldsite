<!--==================================================
CONTACT FAQ
===================================================-->

<section class="pmx-faq pmx-section pmx-bg-light">

    <div class="container">

        <div class="text-center mb-5">

            <span class="pmx-section-heading__subtitle">

                FAQ

            </span>

            <h2 class="pmx-section-heading__title">

                Frequently Asked Questions

            </h2>

        </div>

        <div class="accordion" id="contactFAQ">

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button class="accordion-button"
                        data-bs-toggle="collapse"
                        data-bs-target="#cfaq1">

                        How quickly do you respond?

                    </button>

                </h2>

                <div id="cfaq1"
                    class="accordion-collapse collapse show"
                    data-bs-parent="#contactFAQ">

                    <div class="accordion-body">

                        Most enquiries receive a response within one business day.

                    </div>

                </div>

            </div>

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button class="accordion-button collapsed"
                        data-bs-toggle="collapse"
                        data-bs-target="#cfaq2">

                        Can I schedule an appointment?

                    </button>

                </h2>

                <div id="cfaq2"
                    class="accordion-collapse collapse"
                    data-bs-parent="#contactFAQ">

                    <div class="accordion-body">

                        Yes. Contact us by phone or email and we'll arrange a convenient meeting.

                    </div>

                </div>

            </div>

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button class="accordion-button collapsed"
                        data-bs-toggle="collapse"
                        data-bs-target="#cfaq3">

                        Do you work with international clients?

                    </button>

                </h2>

                <div id="cfaq3"
                    class="accordion-collapse collapse"
                    data-bs-parent="#contactFAQ">

                    <div class="accordion-body">

                        Yes. We proudly serve both local and international customers.

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
